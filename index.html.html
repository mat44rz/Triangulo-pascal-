<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triángulo de Pascal</title>
<style>
:root{--bg:#eef3f5;--fg:#14213d;--mut:#5b6b82;--card:#fff;--line:#cdd8e0;--acc:#0a8f84;--par:#f6c945;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a2b;--fg:#e8f0f7;--mut:#93a5bb;--card:#16273d;--line:#2a405b;--acc:#2ad4c4;--on:#0e1a2b}}
:root[data-theme="dark"]{--bg:#0e1a2b;--fg:#e8f0f7;--mut:#93a5bb;--card:#16273d;--line:#2a405b;--acc:#2ad4c4;--on:#0e1a2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 ui-rounded,"SF Pro Rounded",Nunito,"Segoe UI",system-ui,sans-serif}
.app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
h1{font:700 1.3rem/1.15 Georgia,"Times New Roman",serif;margin:0}
h1 small{display:block;font:400 .85rem ui-rounded,system-ui,sans-serif;color:var(--mut)}
.hud{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:4px 11px;font:inherit;font-size:.9rem;cursor:pointer}
.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.3)}}
#tri{display:flex;flex-direction:column;gap:5px;align-items:center;margin:6px 0 14px}
.r{display:flex;gap:4px;border-radius:99px}
.r.flash{animation:fl .9s}
@keyframes fl{30%{background:color-mix(in srgb,var(--acc) 30%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 30%,transparent)}}
.c{width:min(40px,10.4vw);height:min(40px,10.4vw);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:min(.95rem,3.6vw);border:2px dashed var(--line);color:var(--mut);transition:background .2s}
.c.g{border:2px solid var(--line);background:var(--card);color:var(--mut);font-weight:400}
.c.d{border:2px solid var(--acc);background:var(--acc);color:var(--on)}
.c.act{border-color:var(--acc);color:var(--acc);animation:pulse 1.1s infinite}
.c.par{border:2px solid var(--par);background:var(--par);color:#14213d;animation:wob 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--acc) 25%,transparent)}}
@keyframes wob{50%{transform:translateY(-3px)}}
.c.pop{animation:pop .55s}
@keyframes pop{0%{transform:scale(.3)}55%{transform:scale(1.4);box-shadow:0 0 0 10px color-mix(in srgb,var(--acc) 35%,transparent)}100%{transform:scale(1)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card p{margin:0 0 10px}
.mut{color:var(--mut);font-size:.9rem;min-height:1.3em}
.ask{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{width:70px;height:46px;text-align:center;font:700 1.2rem Georgia,serif;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}
input.in:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--par);outline-offset:2px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.btn{border:0;border-radius:12px;background:var(--acc);color:var(--on);font-weight:700;font-size:1rem;font-family:inherit;padding:12px 16px;cursor:pointer}
.btn.gh{background:transparent;color:var(--mut);border:2px solid var(--line);font-weight:400}
.bar{height:8px;background:var(--line);border-radius:9px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .5s}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="app">
<header>
<h1>Triángulo de Pascal<small>Constrúyelo fila por fila</small></h1>
<div class="hud"><span id="xp" class="chip">⭐ 0</span><span id="st" class="chip">🔥 0</span><button id="snd" class="chip" aria-label="Activar o silenciar sonido">🔊</button></div>
</header>
<div id="tri"></div>
<div class="card">
<p id="msg"></p>
<div class="ask"><input id="ans" class="in" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Respuesta"><button id="ok" class="btn">Comprobar</button><button id="hint" class="btn gh">Pista</button></div>
<p id="hl" class="mut"></p>
</div>
<div class="bar"><i id="bar"></i></div>
</div>
<canvas id="cv"></canvas>
<script>
const $=s=>document.querySelector(s),N=7;
let on=true,xp=0,st=0,ac,idx=0,order=[];
function tone(f,d=.18,ty='sine',v=.16,w=0){if(!on)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+w;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SC=[523,587,659,784,880,1047,1175,1319];
const good=()=>{const f=SC[Math.min(st,7)];tone(f,.22,'triangle');tone(f*2,.12,'sine',.06,.05)};
const bad=()=>{tone(180,.18,'sawtooth',.09);tone(140,.25,'sawtooth',.09,.12)};
const lvl=()=>[659,784,988].forEach((f,i)=>tone(f,.2,'square',.06,i*.07));
const fan=()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.4,'triangle',.14,i*.11));
function hud(b){$('#xp').textContent='⭐ '+xp;$('#st').textContent='🔥 '+st;if(b){const e=$(b);e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}}
function shake(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}
$('#snd').onclick=()=>{on=!on;$('#snd').textContent=on?'🔊':'🔇'};
function confetti(){const cv=$('#cv'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cl=['#f6c945','#2ad4c4','#ff6b7a','#7aa2ff','#9be564'];
const p=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*14,vy:-Math.random()*15-4,s:5+Math.random()*6,c:cl[Math.random()*5|0],r:Math.random()*6}));
let t=0;(function f(){x.clearRect(0,0,cv.width,cv.height);p.forEach(q=>{q.vy+=.35;q.x+=q.vx;q.y+=q.vy;q.r+=.2;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);x.restore()});if(++t<150)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})()}
const P=[[1]];for(let r=1;r<=N;r++){const w=[1];for(let c=1;c<r;c++)w.push(P[r-1][c-1]+P[r-1][c]);w.push(1);P.push(w)}
const cell=(r,c)=>$('#t'+r+'_'+c);
function build(){const T=$('#tri');T.innerHTML='';order=[];idx=0;
for(let r=0;r<=N;r++){const d=document.createElement('div');d.className='r';d.id='r'+r;
for(let c=0;c<=r;c++){const s=document.createElement('div');s.id='t'+r+'_'+c;const edge=c==0||c==r;s.className='c'+(edge?' g':'');s.textContent=edge?1:'';d.appendChild(s);if(!edge)order.push([r,c])}
T.appendChild(d)}
$('#bar').style.width='0';$('#ans').disabled=false;$('#ok').textContent='Comprobar';active()}
function active(){document.querySelectorAll('.act,.par').forEach(e=>e.classList.remove('act','par'));$('#hl').textContent='';
if(idx>=order.length){$('#msg').textContent='¡Triángulo completo! Cada número es la suma de los dos de arriba.';$('#ans').disabled=true;$('#ok').textContent='Empezar de nuevo';return}
const[r,c]=order[idx];cell(r,c).classList.add('act');cell(r-1,c-1).classList.add('par');cell(r-1,c).classList.add('par');
$('#msg').textContent='Fila '+r+': cada número es la suma de los dos amarillos de arriba. ¿Cuál va en el círculo que parpadea?';$('#ans').value='';$('#ans').focus({preventScroll:true})}
function checkT(){
if(idx>=order.length){build();return}
const[r,c]=order[idx],e=$('#ans');
if(e.value.trim()!==''&&+e.value===P[r][c]){
st++;xp+=10;good();hud('#xp');
const s=cell(r,c);s.className='c d pop';s.textContent=P[r][c];
idx++;$('#bar').style.width=(idx/order.length*100)+'%';
let note='';
if(c==r-1){$('#r'+r).classList.add('flash');lvl();note='Fila '+r+' completa. Suma = '+P[r].reduce((a,b)=>a+b)+' = 2^'+r+'. ¿Ves el patrón?'}
if(idx>=order.length){setTimeout(()=>{fan();confetti();xp+=50;hud('#xp')},300)}
active();$('#hl').textContent=note
}else{st=0;bad();hud('#st');shake(e);$('#hl').textContent='Casi. Suma los dos números amarillos y prueba otra vez.'}}
$('#ok').onclick=checkT;
$('#ans').onkeydown=e=>{if(e.key=='Enter')checkT()};
$('#hint').onclick=()=>{if(idx>=order.length)return;const[r,c]=order[idx];$('#hl').textContent='Pista: '+P[r-1][c-1]+' + '+P[r-1][c]+' = ?'};
build();
</script>
</body></html>
